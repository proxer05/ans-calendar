name: Timetable PDF -> ICS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC - picks up changes to the PDF

permissions:
  contents: write         # needed to commit plan.ics back to the repo

env:
  PLAN_URL: "https://ans.konin.pl/images/MiA/AiR%20plany%202026_2027/plan%20automatyka%201.pdf"
  CAL_NAME: "AiR rok I sem I 2026/27"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download PDF
        run: curl -fsSL --retry 3 -o plan.pdf "$PLAN_URL"

      - name: Build plan.ics
        run: python scripts/plan_to_ics.py plan.pdf -o plan.ics --dump-text plan.txt --calname "$CAL_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plan-ics
          path: |
            plan.ics
            plan.txt

      - name: Commit plan.ics if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.ics
          git diff --cached --quiet || (git commit -m "Update timetable ICS" && git push)
